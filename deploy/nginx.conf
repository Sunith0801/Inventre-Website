# /etc/nginx/sites-available/inventre
#
# After editing the server_name below:
#   ln -s /etc/nginx/sites-available/inventre /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d yourdomain.com -d www.yourdomain.com
#
# certbot will auto-rewrite this to listen on 443 with the right cert.

server {
  listen 80;
  listen [::]:80;
  server_name yourdomain.com www.yourdomain.com;

  client_max_body_size 12M;

  # Exchange/return photo uploads. Photos are sent in size-bounded batches
  # (~10 MB target) but a single photo may be up to 50 MB and is uploaded
  # alone, so this endpoint needs headroom above the site-wide 12 MB. 60 MB
  # clears one max-size photo plus multipart overhead.
  location = /api/returns/upload {
    client_max_body_size 60M;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  # Next.js static assets
  location /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_cache_valid 200 365d;
    expires 365d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}
