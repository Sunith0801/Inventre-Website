modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      valid_http_versions: [HTTP/1.1, HTTP/2.0]
      valid_status_codes: [200]
      follow_redirects: true
      fail_if_ssl: false
      fail_if_not_ssl: true
      method: GET

  http_post_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      method: POST
      valid_status_codes: [200, 201, 204]

  tcp_connect:
    prober: tcp
    timeout: 5s

  icmp:
    prober: icmp
    timeout: 5s
