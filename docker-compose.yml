# Local dev stack — mirrors what runs on Hetzner via Coolify.
# Run:  docker compose up -d
# Stop: docker compose down
# Reset: docker compose down -v   (drops volumes)

services:
  postgres:
    image: postgres:16-alpine
    container_name: inventre-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventre
      POSTGRES_PASSWORD: inventre_dev
      POSTGRES_DB: inventre
    ports:
      # 55432 to avoid colliding with a host-installed Postgres on 5432
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventre -d inventre"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: inventre-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: inventre
      DB_PASSWORD: inventre_dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: inventre
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      ADMIN_USERS: inventre
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"

  redis:
    image: redis:7-alpine
    container_name: inventre-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: inventre-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: inventre
      MINIO_ROOT_PASSWORD: inventre_dev_secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Bootstrap the inventre bucket on first run
  minio-init:
    image: minio/mc:latest
    container_name: inventre-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 inventre inventre_dev_secret;
      mc mb --ignore-existing local/inventre;
      mc anonymous set download local/inventre;
      echo 'MinIO bucket ready';
      "
    restart: "no"

volumes:
  pgdata:
  redisdata:
  miniodata:
