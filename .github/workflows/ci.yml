name: CI

# The gate that stops unverified code reaching a branch someone might deploy.
#
# scripts/deploy.sh runs the same two commands in its preflight, so a green
# tick here means a deploy will not be blocked by them either. It runs on
# every branch deliberately: this repository deploys from a WORKING TREE, so
# a broken branch is one `git checkout` away from being what ships.
#
# Node 20 to match the Dockerfile (node:20-alpine); npm because deploy.sh
# builds with npm and package-lock.json is the authoritative lockfile — the
# pnpm-lock.yaml in the root is a leftover from June and should go once
# somebody confirms nothing still uses it.
#
# Two jobs. `verify` is types, tests, lint, formatting and advisories, and
# needs nothing but Node. `build` needs a database, because static generation
# reaches one for 173 pages, so it stands up Postgres and builds the schema
# from db/migrations before compiling.
#
# That second job was impossible until 2026-09-10. The migration chain could
# not build an empty database: `drizzle-kit push` had put one schema, eleven
# tables, 110 columns and an enum onto the live databases that no migration
# ever wrote down, so the chain died at 0015 after 73 of 116 tables. Fixing
# that is what makes this gate possible — and the gate is now what keeps it
# fixed, because a migration that cannot apply to an empty database fails here
# on the branch that introduces it, not during a disaster.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: types + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # The formatting ratchet diffs against the base branch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        # tsconfig.check.json covers app, components, lib, server, db and
        # tests. scripts/ is excluded: it holds 7 known errors in one-off ops
        # tools that never ship, tracked separately via `npm run typecheck:scripts`.
        run: npm run typecheck

      - name: Tests
        # Includes tests/architecture/ — executable rules asserting that every
        # admin section is gated, every /api/admin route names a permission,
        # next.config.mjs still serves the security headers, no connection
        # string is hardcoded in shipping code, and no client component
        # imports the database. Each encodes a real past incident.
        run: npm run test

      - name: Lint
        # Blocking on ERRORS only. The config splits defect rules (blocking)
        # from next/core-web-vitals style rules (warnings): 86 warnings exist
        # today and every one is cosmetic or a behavioural choice — swapping
        # <a href> for <Link> turns a full page load into a client-side
        # navigation, which is a product decision, not a lint fix. A gate that
        # is red on day one teaches everyone to ignore it.
        run: npm run lint

      - name: Formatting of CHANGED files only
        # THE RATCHET. 541 of 681 files predate any formatter; reformatting
        # them would be a 15,000-line diff that buries every real change and
        # collides with everyone working in parallel. So new and edited code
        # must conform, and the rest converges as files are touched.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD \
                    | grep -E '\.(ts|tsx|mjs|json)$' \
                    | grep -vE '^(db/migrate\.js|.*\.snapshot\.json)$' || true)
          if [ -z "$CHANGED" ]; then echo "no formattable files changed"; exit 0; fi
          echo "$CHANGED" | xargs npx prettier --check

      - name: No critical advisories
        # Blocking at `critical` rather than `high` on purpose. The five highs
        # that remain all need semver-MAJOR upgrades (drizzle 0.36 -> 0.45,
        # next 15 -> 16, nodemailer 6 -> 10, sharp 0.34 -> 0.35) and xlsx has
        # no fix on the registry at all. Gating on `high` would paint CI red
        # permanently and teach everyone to ignore it. Gating on `critical`
        # is a promise the team can actually keep, and it catches the next
        # one on the day it lands.
        run: npm audit --omit=dev --audit-level=critical

      - name: Report remaining advisories
        # Visible, not blocking — so the five highs stay in front of people
        # without holding the branch hostage.
        if: always()
        run: npm audit --omit=dev || true

  build:
    name: build (schema rebuilt from migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Postgres 16 to match docker-compose.deploy.yml. Nothing is restored into
    # it: the point is to prove db/migrations can build the schema from
    # nothing, which is the same property disaster recovery depends on.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventre_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/inventre_ci
      DATABASE_DIRECT_URL: postgres://postgres:postgres@127.0.0.1:5432/inventre_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the schema from db/migrations
        # THE FIRST ASSERTION, and the one that has never been made before:
        # every migration applies, in order, to a database that starts empty.
        # A migration that reads a table it does not create, or that was
        # written against a shape the repository no longer describes, fails
        # here — on the branch that adds it.
        #
        # MIGRATE_SKIP_HISTORICAL_SEEDS skips 0037, a 3.7 MB pg_dump of the
        # May-2026 catalog whose positional INSERTs carry two columns that
        # schema.ts has since dropped. It cannot replay onto today's schema and
        # rewriting historical rows by hand would be worse. db/migrate.ts
        # documents the exception; nothing else is skipped.
        env:
          MIGRATE_SKIP_HISTORICAL_SEEDS: "1"
        run: npx tsx db/migrate.ts

      - name: Assert the schema matches db/schema.ts
        # Cheap, and it catches the failure mode this job would otherwise miss:
        # a chain that applies cleanly but builds the WRONG schema, which is
        # how 110 columns went missing in the first place.
        run: npx tsx scripts/assert-schema-complete.ts

      - name: Build
        # The gate itself. Static generation renders 173 pages against the
        # database above, so this fails on a bad query, a bad import, or a
        # column that only exists on somebody's laptop.
        #
        # Secrets are deliberately fake: nothing here should reach a real
        # service, and a build that needs a live credential is a bug worth
        # finding. NEXT_DIST_DIR keeps the output away from `.next`, which on
        # the deploy host is a live artefact.
        env:
          NEXT_DIST_DIR: .next-ci
          NODE_ENV: production
          JWT_SECRET: ci-build-only-not-a-real-secret
          AUTH_SECRET: ci-build-only-not-a-real-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run build
