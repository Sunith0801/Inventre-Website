name: CI

# The gate that stops unverified code reaching a branch someone might deploy.
#
# scripts/deploy.sh runs the same two commands in its preflight, so a green
# tick here means a deploy will not be blocked by them either. It runs on
# every branch deliberately: this repository deploys from a WORKING TREE, so
# a broken branch is one `git checkout` away from being what ships.
#
# Node 20 to match the Dockerfile (node:20-alpine); npm because deploy.sh
# builds with npm and package-lock.json is the authoritative lockfile — the
# pnpm-lock.yaml in the root is a leftover from June and should go once
# somebody confirms nothing still uses it.
#
# NOT here yet: `npm run build`. Static generation reaches the database for
# 173 pages, so CI would need a Postgres service seeded by db/migrate.ts —
# and on 2026-09-10 that was tested and does NOT work: migration 0015
# (backfill_student_parent_id) references student_guardian_links, which a
# later migration creates, so the chain stops at 73 of 116 tables on an empty
# database. Until 0015 is made defensive, the schema cannot be rebuilt from
# source, disaster recovery depends entirely on the nightly dump, and a build
# gate here is impossible. The build IS still gated — at deploy, by
# scripts/deploy.sh, which builds and then verifies the live site.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: types + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # The formatting ratchet diffs against the base branch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        # tsconfig.check.json covers app, components, lib, server, db and
        # tests. scripts/ is excluded: it holds 7 known errors in one-off ops
        # tools that never ship, tracked separately via `npm run typecheck:scripts`.
        run: npm run typecheck

      - name: Tests
        # Includes tests/architecture/ — executable rules asserting that every
        # admin section is gated, every /api/admin route names a permission,
        # next.config.mjs still serves the security headers, no connection
        # string is hardcoded in shipping code, and no client component
        # imports the database. Each encodes a real past incident.
        run: npm run test

      - name: Lint
        # Blocking on ERRORS only. The config splits defect rules (blocking)
        # from next/core-web-vitals style rules (warnings): 86 warnings exist
        # today and every one is cosmetic or a behavioural choice — swapping
        # <a href> for <Link> turns a full page load into a client-side
        # navigation, which is a product decision, not a lint fix. A gate that
        # is red on day one teaches everyone to ignore it.
        run: npm run lint

      - name: Formatting of CHANGED files only
        # THE RATCHET. 541 of 681 files predate any formatter; reformatting
        # them would be a 15,000-line diff that buries every real change and
        # collides with everyone working in parallel. So new and edited code
        # must conform, and the rest converges as files are touched.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD \
                    | grep -E '\.(ts|tsx|mjs|json)$' \
                    | grep -vE '^(db/migrate\.js|.*\.snapshot\.json)$' || true)
          if [ -z "$CHANGED" ]; then echo "no formattable files changed"; exit 0; fi
          echo "$CHANGED" | xargs npx prettier --check

      - name: No critical advisories
        # Blocking at `critical` rather than `high` on purpose. The five highs
        # that remain all need semver-MAJOR upgrades (drizzle 0.36 -> 0.45,
        # next 15 -> 16, nodemailer 6 -> 10, sharp 0.34 -> 0.35) and xlsx has
        # no fix on the registry at all. Gating on `high` would paint CI red
        # permanently and teach everyone to ignore it. Gating on `critical`
        # is a promise the team can actually keep, and it catches the next
        # one on the day it lands.
        run: npm audit --omit=dev --audit-level=critical

      - name: Report remaining advisories
        # Visible, not blocking — so the five highs stay in front of people
        # without holding the branch hostage.
        if: always()
        run: npm audit --omit=dev || true
